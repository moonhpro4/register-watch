name: Build Android app
on:
  push:
    paths: ["app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo install --fix
      - name: Patch background-actions to support the specialUse service type (Android 14+)
        run: |
          python3 - <<'PY'
          p = "node_modules/react-native-background-actions/android/src/main/java/com/asterinet/react/bgactions/BackgroundTaskOptions.java"
          s = open(p).read(); old = '            case "dataSync":'; assert old in s
          s = s.replace(old, '            case "specialUse":\n                return Build.VERSION.SDK_INT >= 34 ? ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE : 0;\n' + old, 1)
          open(p, "w").write(s)
          PY
      - run: npx expo prebuild --platform android --no-install
      - name: Pin androidx.core (needed by background service library)
        run: echo 'allprojects { configurations.all { resolutionStrategy.force "androidx.core:core:1.13.1", "androidx.core:core-ktx:1.13.1" } }' >> android/build.gradle
      - name: Gradle build
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log || {
            grep -n -E "What went wrong|error:|e: |FAILURE|Could not|not found" -A3 ../build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:200}"; done
            exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: register-watch-apk, path: app/android/app/build/outputs/apk/release/*.apk }
      - name: Name the APK
        working-directory: .
        run: cp app/android/app/build/outputs/apk/release/*.apk ShadiCam-v0.1.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Shadi Cam v0.1.${{ github.run_number }} (in development)
          prerelease: true
          files: ShadiCam-v0.1.${{ github.run_number }}.apk
          body: |
            **Still in development. It may not work correctly.**
            **هذا التطبيق ما زال قيد التطوير وقد لا يعمل بشكل صحيح.**

            Android only. Install the APK; on first launch enter your Worker address and app key.
