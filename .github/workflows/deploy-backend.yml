name: Deploy backend
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create D1 database and R2 bucket
        run: |
          getid(){ npx wrangler@3 d1 list --json | python3 -c "import sys,json;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='register-watch'),''))"; }
          ID=$(getid)
          if [ -z "$ID" ]; then npx wrangler@3 d1 create register-watch; ID=$(getid); fi
          [ -n "$ID" ] || { echo "::error::could not get D1 id"; exit 1; }
          sed -i "s/PUT_YOUR_D1_ID_HERE/$ID/" wrangler.toml
          pip install boto3 -q
          python3 - <<'PY'
          import boto3, os
          s3 = boto3.client("s3", endpoint_url=f"https://{os.environ['CLOUDFLARE_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"], region_name="auto")
          try:
              names = [b["Name"] for b in s3.list_buckets()["Buckets"]]
              print("::notice::R2 buckets:", names)
              if "register-watch" not in names:
                  s3.create_bucket(Bucket="register-watch"); print("::notice::R2 bucket register-watch created")
          except Exception as e:
              print("::error::R2:", str(e)[:300])
          PY
      - run: npx wrangler@3 d1 execute register-watch --remote --file=schema.sql
      - name: Deploy Worker
        run: |
          npx wrangler@3 deploy > deploy.log 2>&1 || { grep -v '^$' deploy.log | tail -14 | while IFS= read -r l; do echo "::error::${l:0:220}"; done; exit 1; }
          cat deploy.log
      - name: Set app key
        run: printf %s "${{ secrets.APP_KEY }}" | npx wrangler@3 secret put APP_KEY
      - name: Find Worker address
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          echo "URL=https://register-watch.$SUB.workers.dev" >> $GITHUB_ENV
          echo "::notice::WORKER_URL=https://register-watch.$SUB.workers.dev"
      - name: Live test
        run: BASE=$URL KEY="${{ secrets.APP_KEY }}" bash smoke.sh
