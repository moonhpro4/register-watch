name: Diagnose Cloudflare
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          api(){ curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/$1"; }
          echo "::notice::token verify: $(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify | head -c 200)"
          echo "::notice::R2 buckets: $(api r2/buckets | head -c 400)"
          echo "::notice::workers subdomain: $(api workers/subdomain | head -c 200)"
          echo "::notice::gemma models: $(api 'ai/models/search?search=gemma&per_page=30' | python3 -c "import sys,json;d=json.load(sys.stdin);print([m['name'] for m in d.get('result',[])] or d.get('errors'))")"
